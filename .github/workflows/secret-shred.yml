name: Secret chat shredder

# Destroys the encryption keys of expired secret-chat messages, which is what
# makes their expiry irreversible (see db/schema.sql v26: deleting a row in
# CockroachDB leaves MVCC history, replicas and weeks of managed backups behind,
# so expiry is crypto-shredding, not deletion).
#
# THIS IS THE BACKSTOP, NOT THE MECHANISM. api/_routes/secret-chat.ts shreds on
# every touch of the thread, which is the only way a 1-minute timer can work at
# all: GitHub's scheduler has minutes of jitter under load and cannot be relied
# on for anything prompt. This run exists for couples who stop opening the app,
# so nothing outlives its timer just because nobody came back.
#
# Nothing is ever sent here and no user is touched, so unlike the other
# reminder workflows there is no "sent:0" to warn about; the report is counts.
#
# Hourly. Setup is the same as the other workflows: repo secrets APP_URL +
# CRON_SECRET, matching CRON_SECRET in the Vercel project settings.

on:
  schedule:
    - cron: '17 * * * *' # hourly, off the hour to dodge the busiest scheduler minute
  workflow_dispatch: {} # run it by hand from the Actions tab to test

jobs:
  shred:
    runs-on: ubuntu-latest
    steps:
      - name: Shred expired secret messages
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "$APP_URL/api/cron/reminders?kind=shred" \
            -H "Authorization: Bearer $CRON_SECRET")
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $status"
          echo "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Shredder endpoint returned $status"
            exit 1
          fi
